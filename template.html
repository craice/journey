<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey Artifact</title>
<style id="theme">
:root {
  --zoom: 1;
  --col-w: calc(232px * var(--zoom));
  --lane-w: calc(124px * var(--zoom));
  --ink: #111;
  --ink-soft: #8a8a8a;
  --ink-faint: #b5b5b5;
  --rule: #e3e3e3;
  --accent: #e2231a;
  --paper: #fff;
  --type: calc(13px * var(--zoom));
  --type-small: calc(9px * var(--zoom));
  --type-mono: calc(10px * var(--zoom));
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
  font-feature-settings: "tnum";
  -webkit-font-smoothing: antialiased;
}

.sheet {
  margin-top: 32px;
  padding: 8px 36px 64px;
  width: max-content;
  min-width: 100%;
  border-top: 3px solid var(--ink);
}

.masthead {
  display: flex;
  align-items: baseline;
  gap: 24px;
  margin-bottom: 20px;
  position: sticky;
  left: 0;
  width: max-content;
}
.masthead h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.masthead .meta {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  gap: 18px;
}

.toolbar { display: flex; gap: 6px; align-items: center; }
.toolbar button {
  font: inherit;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: none;
  border: 1px solid var(--rule);
  padding: 4px 9px;
  cursor: pointer;
}
.toolbar button:hover { border-color: var(--ink); }
.toolbar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary {
  position: sticky;
  left: 0;
  width: max-content;
  max-width: 100%;
  margin-bottom: 22px;
  font-size: 11px;
  line-height: 1.5;
}
.summary__count { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.summary__list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.summary__item {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.summary__item:hover { color: var(--accent); }
.summary__item::before {
  content: "";
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  background: var(--accent);
  transform: translateY(-1px);
}
.summary__item--risk::before { background: none; border: 1px solid var(--accent); }
.summary__where { color: var(--ink-soft); }

.grid {
  display: grid;
  grid-template-columns: var(--lane-w) repeat(var(--cols), minmax(var(--col-w), 1fr));
  align-items: stretch;
}

.col-head, .lane-label, .cell {
  font-size: var(--type);
  line-height: 1.45;
  padding: 11px 16px 13px 0;
  border-bottom: 1px solid var(--rule);
}

.col-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--paper);
  border-bottom: 1px solid var(--ink);
  font-size: var(--type-small);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding-bottom: 6px;
}
.col-head__num { color: var(--ink-faint); margin-right: 7px; }

.lane-label {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--paper);
  font-size: var(--type-small);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding-right: 24px;
}
.col-head--corner { position: sticky; left: 0; top: 0; z-index: 3; background: var(--paper); border-bottom-color: var(--ink); }

.cell__ref {
  display: block;
  margin-top: 6px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: var(--type-mono);
  letter-spacing: 0;
  color: var(--ink-soft);
}
.cell__note { display: block; margin-top: 5px; color: var(--ink-soft); }
.cell__flag {
  display: inline-block;
  font-size: var(--type-small);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-right: 8px;
}
.cell__flag::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--accent);
  margin-right: 6px;
  transform: translateY(0);
}
.cell--flag-risk .cell__flag::before { background: none; border: 1px solid var(--accent); }
.cell--target { animation: flash 1.2s ease-out; }
@keyframes flash {
  from { background: #fdece9; }
  to { background: transparent; }
}

.divider {
  grid-column: 1 / -1;
  border-top: 1px solid var(--ink);
  margin: 2px 0 0;
}
.divider__label {
  grid-column: 1 / -1;
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 3px 0 6px;
  position: sticky;
  left: 0;
}

.emotion { position: relative; padding: 0; border-bottom: 1px solid var(--rule); }
.emotion__svg { display: block; width: 100%; height: calc(76px * var(--zoom)); overflow: visible; }
.emotion__axis { stroke: #cfcfcf; stroke-width: 1; stroke-dasharray: 2 3; }
.emotion__line { fill: none; stroke: var(--ink); stroke-width: 1; }
.emotion__dot { fill: var(--ink); }
.emotion__dot--flag { fill: var(--accent); }
.emotion__label {
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  fill: var(--ink-soft);
}

.errors {
  border: 1px solid var(--accent);
  padding: 20px 22px;
  max-width: 680px;
  font-size: 13px;
  line-height: 1.6;
}
.errors h2 { font-size: 13px; letter-spacing: -0.01em; margin: 0 0 10px; }
.errors ul { margin: 0; padding-left: 18px; }
.errors code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

@media print {
  .toolbar { display: none; }
  body { background: #fff; }
  .sheet { padding: 0; width: auto; min-width: 0; }
  .masthead, .summary, .lane-label, .col-head, .divider__label { position: static; width: auto; }
  .cell, .col-head, .lane-label { break-inside: avoid; }
  .summary__item { color: #111; }
}
@page { size: landscape; margin: 12mm; }
</style>
</head>
<body>
<div id="root"></div>

<script type="application/json" id="artifact">
{
  "type": "blueprint",
  "title": "Untitled",
  "steps": [{ "id": "step-1", "label": "Step 1" }],
  "lanes": [{ "id": "actions", "label": "User actions", "kind": "cards", "cells": [] }]
}
</script>

<script id="core">
/* Pure functions. No DOM access allowed in this block — it is evaluated
   standalone by the test suite in a node:vm context. */

const ARTIFACT_TYPES = ['blueprint', 'journey'];
const LANE_KINDS = ['cards', 'emotion'];

function isFilledString(value) {
  return typeof value === 'string' && value.trim().length > 0;
}

function validateModel(data) {
  const errors = [];
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    return { ok: false, errors: ['The artifact data must be an object.'] };
  }

  if (!ARTIFACT_TYPES.includes(data.type)) {
    errors.push(
      `Unknown type ${JSON.stringify(data.type)}. Supported types: ${ARTIFACT_TYPES.join(', ')}.`
    );
  }
  if (!isFilledString(data.title)) errors.push('The artifact needs a non-empty "title".');

  const steps = Array.isArray(data.steps) ? data.steps : [];
  const lanes = Array.isArray(data.lanes) ? data.lanes : [];
  if (steps.length === 0) errors.push('The artifact needs at least one step.');
  if (lanes.length === 0) errors.push('The artifact needs at least one lane.');

  const seenSteps = new Set();
  steps.forEach((step, index) => {
    if (!isFilledString(step && step.id)) errors.push(`Step #${index + 1} needs an "id".`);
    else if (seenSteps.has(step.id)) errors.push(`Duplicate step id ${JSON.stringify(step.id)}.`);
    else seenSteps.add(step.id);
    if (!isFilledString(step && step.label)) {
      errors.push(`Step ${JSON.stringify((step && step.id) || index + 1)} needs a "label".`);
    }
  });

  const seenLanes = new Set();
  lanes.forEach((lane, index) => {
    if (!isFilledString(lane && lane.id)) errors.push(`Lane #${index + 1} needs an "id".`);
    else if (seenLanes.has(lane.id)) errors.push(`Duplicate lane id ${JSON.stringify(lane.id)}.`);
    else seenLanes.add(lane.id);
    if (!isFilledString(lane && lane.label)) {
      errors.push(`Lane ${JSON.stringify((lane && lane.id) || index + 1)} needs a "label".`);
    }
    if (!LANE_KINDS.includes(lane && lane.kind)) {
      errors.push(
        `Lane ${JSON.stringify((lane && lane.id) || index + 1)} has kind ` +
        `${JSON.stringify(lane && lane.kind)}. Supported kinds: ${LANE_KINDS.join(', ')}.`
      );
    }
  });

  const stepIndex = new Map(steps.map((step, index) => [step && step.id, index]));

  lanes.forEach((lane) => {
    const laneId = JSON.stringify((lane && lane.id) || '?');
    const cells = Array.isArray(lane && lane.cells) ? lane.cells : [];
    const occupied = new Map();

    cells.forEach((cell, cellIndex) => {
      const where = `cell #${cellIndex + 1} in lane ${laneId}`;

      const hasStep = stepIndex.has(cell && cell.step);
      if (!hasStep) {
        errors.push(`Unknown step ${JSON.stringify(cell && cell.step)} in lane ${laneId}.`);
      }

      const span = cell.span === undefined ? 1 : cell.span;
      const spanValid = Number.isInteger(span) && span >= 1;
      if (!spanValid) {
        errors.push(`The span of ${where} must be an integer of 1 or more.`);
      }

      if (hasStep && spanValid) {
        const start = stepIndex.get(cell.step);
        if (start + span > steps.length) {
          errors.push(
            `The span of ${where} runs past the last step ` +
            `(starts at step ${start + 1}, spans ${span}, ${steps.length} steps exist).`
          );
        } else {
          let reported = false;
          for (let column = start; column < start + span; column += 1) {
            if (occupied.has(column)) {
              if (!reported) {
                errors.push(
                  `Cells overlap in lane ${laneId} at step ` +
                  `${JSON.stringify(steps[column].id)}.`
                );
                reported = true;
              }
            }
            occupied.set(column, cellIndex);
          }
        }
      }

      if (cell.flag !== undefined && !['gap', 'risk'].includes(cell.flag)) {
        errors.push(`The flag ${JSON.stringify(cell.flag)} on ${where} must be "gap" or "risk".`);
      }

      if (lane.kind === 'emotion') {
        if (!Number.isInteger(cell.score) || cell.score < -3 || cell.score > 3) {
          errors.push(`The score of ${where} must be an integer from -3 to 3.`);
        }
      } else if (!isFilledString(cell.text)) {
        errors.push(`The ${where} needs "text".`);
      }
    });
  });

  const emotionLanes = lanes.filter((lane) => lane && lane.kind === 'emotion');
  if (emotionLanes.length > 1) {
    errors.push('An artifact may hold at most one emotion lane.');
  }
  if (data.type === 'journey' && emotionLanes.length !== 1) {
    errors.push('A journey needs exactly one emotion lane.');
  }

  const laneIds = new Set(lanes.map((lane) => lane && lane.id));
  const dividers = Array.isArray(data.dividers) ? data.dividers : [];
  dividers.forEach((divider, index) => {
    if (!laneIds.has(divider && divider.after)) {
      errors.push(
        `Unknown lane ${JSON.stringify(divider && divider.after)} ` +
        `in divider #${index + 1}.`
      );
    }
  });

  return { ok: errors.length === 0, errors };
}

/** Turns a validated model into a grid-ready layout.
    Relies on validateModel having already passed: data.steps and data.lanes are
    non-empty arrays, all cell step references are valid, and all divider lane
    references are valid. This function performs no shape checking of its own. */
function buildLayout(data) {
  const columnOf = new Map(data.steps.map((step, index) => [step.id, index + 1]));

  const columns = data.steps.map((step) => ({ id: step.id, label: step.label }));

  const rows = data.lanes.map((lane) => {
    const cells = (Array.isArray(lane.cells) ? lane.cells : [])
      .map((cell) => ({
        step: cell.step,
        key: `${lane.id}:${cell.step}`,
        colStart: columnOf.get(cell.step),
        colSpan: cell.span === undefined ? 1 : cell.span,
        text: cell.text === undefined ? '' : cell.text,
        ref: cell.ref === undefined ? '' : cell.ref,
        note: cell.note === undefined ? '' : cell.note,
        flag: cell.flag === undefined ? '' : cell.flag,
        score: cell.score,
        scoreLabel: cell.label === undefined ? '' : cell.label,
        pinned: cell.pinned === true
      }))
      .sort((a, b) => a.colStart - b.colStart);

    return { id: lane.id, label: lane.label, kind: lane.kind, cells };
  });

  const laneRowIndex = new Map(data.lanes.map((lane, index) => [lane.id, index]));
  const dividers = (Array.isArray(data.dividers) ? data.dividers : [])
    .map((divider) => ({
      afterRowIndex: laneRowIndex.get(divider.after),
      label: divider.label === undefined ? '' : divider.label
    }));

  return { columns, rows, dividers };
}

/** Formats an emotion score with an explicit sign. */
function formatScore(score) {
  return score > 0 ? `+${score}` : String(score);
}

/** Gathers every flagged cell for the summary band, ordered left to right. */
function collectFlags(layout) {
  const counts = { gap: 0, risk: 0 };
  const stepLabelOf = new Map(layout.columns.map((column) => [column.id, column.label]));
  const items = [];

  layout.rows.forEach((row, rowIndex) => {
    row.cells.forEach((cell) => {
      if (cell.flag !== 'gap' && cell.flag !== 'risk') return;
      counts[cell.flag] += 1;
      items.push({
        _column: cell.colStart,
        _row: rowIndex,
        key: cell.key,
        flag: cell.flag,
        laneLabel: row.label,
        stepLabel: stepLabelOf.get(cell.step),
        text: row.kind === 'emotion' ? (cell.scoreLabel || formatScore(cell.score)) : cell.text,
        note: cell.note
      });
    });
  });

  items.sort((a, b) => (a._column - b._column) || (a._row - b._row));
  items.forEach((item) => { delete item._column; delete item._row; });

  return { counts, items };
}

const SCORE_MIN = -3;
const SCORE_MAX = 3;

function round2(value) {
  return Math.round(value * 100) / 100;
}

/** Computes one point per emotion cell, in the coordinate space of the lane's SVG box. */
function sparklinePoints(cells, columnCount, box) {
  if (!Array.isArray(cells) || columnCount < 1) return [];
  const columnWidth = box.width / columnCount;
  const range = SCORE_MAX - SCORE_MIN;

  return cells
    .slice()
    .sort((a, b) => a.colStart - b.colStart)
    .map((cell) => ({
      key: cell.key,
      score: cell.score,
      flag: cell.flag === undefined ? '' : cell.flag,
      x: round2((cell.colStart - 0.5) * columnWidth),
      y: round2(((SCORE_MAX - cell.score) / range) * box.height)
    }));
}

const MIN_SCALE = 0.4;

/** The zoom level that fits contentWidth inside viewportWidth, clamped to a readable floor. */
function fitScale(contentWidth, viewportWidth) {
  if (!(contentWidth > 0) || !(viewportWidth > 0)) return 1;
  const raw = viewportWidth / contentWidth;
  if (raw >= 1) return 1;
  return Math.max(MIN_SCALE, round2(raw));
}
</script>

<script id="ui">
/* DOM layer. */
</script>
</body>
</html>
